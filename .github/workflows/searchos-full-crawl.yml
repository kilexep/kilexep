name: Search OS full knowledge crawl

on:
  push:
    branches:
      - automation/searchos-full-crawl-20260831
    paths:
      - automation/searchos_full_crawl.py
      - .github/workflows/searchos-full-crawl.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out temporary crawler branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install crawler dependencies
        run: python -m pip install --upgrade requests beautifulsoup4 lxml markdownify urllib3

      - name: Crawl and validate all 238 Korean knowledge articles
        shell: bash
        run: |
          set -o pipefail
          python automation/searchos_full_crawl.py 2>&1 | tee crawl.log

      - name: Upload crawl output and validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: searchos-full-crawl
          path: |
            output/
            searchos_crawl_output.zip
            crawl.log
          if-no-files-found: warn
          retention-days: 3
